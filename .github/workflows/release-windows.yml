name: release-windows
# 외부 러너 PC가 온라인이면 거기서 돌고, 꺼져 있거나 없으면 원래 GitHub 호스트에서 돈다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'boothy-v*'
  workflow_dispatch:

jobs:
  windows-baseline:
    runs-on: ${{ case(vars.CI_WINDOWS_RUNNER == 'self-hosted' && github.event_name != 'pull_request', fromJSON('["self-hosted","Windows","X64","erp-dabi"]'), vars.CI_WINDOWS_RUNNER == 'self-hosted' && github.event.pull_request.head.repo.full_name == github.repository, fromJSON('["self-hosted","Windows","X64","erp-dabi"]'), 'windows-latest') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop baseline build
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        run: pnpm build:desktop

      - name: Run signing-ready draft build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/boothy-v')
        run: pnpm release:desktop
